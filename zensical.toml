[project]
site_name = "pyglobegl"
site_description = "anywidget wrapper for globe.gl"
site_author = "Owen Lamont"
site_url = "https://pyglobegl.pages.dev/"
copyright = """
Copyright &copy; 2025-2026 Owen Lamont
"""

repo_url = "https://github.com/owenlamont/pyglobegl"
edit_uri = "blob/main/docs/"
repo_name = "owenlamont/pyglobegl"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quick Start" = "getting-started/quickstart.md" },
  ]},
  { "Layers" = [
    { "Globe & Images" = "layers/globe.md" },
    { "Points" = "layers/points.md" },
    { "Arcs" = "layers/arcs.md" },
    { "Polygons" = "layers/polygons.md" },
    { "Paths" = "layers/paths.md" },
    { "Heatmaps" = "layers/heatmaps.md" },
    { "Hex Bin" = "layers/hex-bin.md" },
    { "Hexed Polygons" = "layers/hexed-polygons.md" },
    { "Tiles" = "layers/tiles.md" },
    { "Particles" = "layers/particles.md" },
    { "Rings" = "layers/rings.md" },
    { "Labels" = "layers/labels.md" },
  ]},
  { "Guides" = [
    { "Runtime Updates & Callbacks" = "guides/runtime-updates.md" },
    { "Frontend Python Callbacks" = "guides/frontend-callbacks.md" },
  ]},
  { "Integrations" = [
    { "GeoPandas" = "integrations/geopandas.md" },
    { "MovingPandas" = "integrations/movingpandas.md" },
  ]},
  { "About" = [
    { "Goals & Roadmap" = "about/roadmap.md" },
  ]},
]

[project.theme]
language = "en"

features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "lucide/globe"
repo = "fontawesome/brands/github"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/owenlamont/pyglobegl"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/pyglobegl/"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
