name: Update Dependencies and Linters
on:
  schedule:
    - cron: '0 10 * * 5'  # Friday 18:00 UTC+8
  workflow_dispatch:

jobs:
  refresh-dependencies-and-linters:
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: write
      pull-requests: write
    env:
      UV_PYTHON: 3.14
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install toolchain
        run: mise install
      - name: Upgrade dependencies
        run: uv sync --upgrade --all-extras
      - name: Update frontend dependencies
        run: |
          cd frontend
          mise exec -- pnpm update
      - name: Install prek
        run: uv tool install prek
      - name: Run prek autoupdate --cooldown-days 7
        run: prek autoupdate --cooldown-days 7
      - name: Sync biome.json $schema to the biome pre-commit hook rev
        run: |
          set -euo pipefail
          hook_block=$(grep -A2 'biomejs/pre-commit' prek.toml || true)
          if [ -z "$hook_block" ]; then
            echo "biomejs/pre-commit hook not found in prek.toml; skipping schema sync."
            exit 0
          fi
          rev=$(printf '%s\n' "$hook_block" | sed -nE 's/^[[:space:]]*rev = "v?([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*$/\1/p')
          if [ -z "$rev" ]; then
            echo "::error::biomejs/pre-commit hook present but its rev is not a plain stable vX.Y.Z tag; refusing to leave biome.json \$schema out of sync. Update the sync step in update.yml." >&2
            exit 1
          fi
          sed -i -E "s#(biomejs\.dev/schemas/)[0-9.]+#\1${rev}#" biome.json
          echo "Synced biome.json \$schema to ${rev}."
      - name: Check for changes
        id: check_diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Generate token
        if: steps.check_diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: generate-token
        with:
          app-id: ${{ secrets.AUTH_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create PR with updated deps and linters
        if: steps.check_diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "chore: refresh dependencies and linters"
          title: "chore: refresh dependencies and linters"
          body: |
            This PR upgrades dependencies via `uv sync --upgrade --all-extras`,
            refreshes `uv.lock`, updates frontend dependencies, updates
            `prek.toml` by running `prek autoupdate --cooldown-days 7`, and
            syncs `biome.json`'s `$schema` to the `biomejs/pre-commit` hook rev.
          branch: bot/update-deps-and-linters
          author: GitHub Actions <actions@github.com>
          delete-branch: true
