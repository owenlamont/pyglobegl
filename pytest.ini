[pytest]
filterwarnings =
    error
    # Solara/uvicorn currently emit websockets deprecations on Windows; ignore until upstream fixes.
    ignore:.*websockets\.server\.WebSocketServerProtocol is deprecated:DeprecationWarning
    # Solara websocket handler hits deprecated path signature in websockets.
    ignore:remove second argument of ws_handler:DeprecationWarning
    # Windows CI intermittently emits unraisable transport/socket warnings on teardown.
    ignore:Exception ignored in.*_ProactorBasePipeTransport.*:pytest.PytestUnraisableExceptionWarning
    ignore:Exception ignored in.*socket\.socket.*:pytest.PytestUnraisableExceptionWarning
    # pytest-playwright 0.10.0 defines its fallback base_url fixture as an instance method;
    # fixed upstream in microsoft/playwright-pytest#345, drop this once a release ships it.
    ignore:Session-scoped fixtures defined as instance methods[^']*'base_url':pytest.PytestRemovedIn10Warning
    # movingpandas 0.23.0 calls sort_index(inplace=True), deprecated in pandas 3.1.
    ignore:The inplace keyword:DeprecationWarning:movingpandas
testpaths = tests
